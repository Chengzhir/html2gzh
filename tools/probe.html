<!DOCTYPE html>
<!-- 开发用的探针页：验证 cqw、container-type、calc() 等写法粘进公众号后还在不在。直接用浏览器打开，点按钮复制，
     粘进一篇测试草稿保存后看预览。结论已经写进转换器，平时用不到；公众号改了规则时可以拿它重测 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>html2gzh 探针</title>
<style>
body{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:24px;background:#f4f1ea;color:#1d1b18}
button{font:inherit;padding:10px 22px;font-size:16px;font-weight:600;border:0;border-radius:6px;background:#1d1b18;color:#fff;cursor:pointer}
#msg{margin-left:12px}
.widths{display:flex;gap:16px;align-items:flex-start;margin-top:18px;flex-wrap:wrap}
.widths>div{background:#fff;border:1px solid #ddd}
.widths p{margin:0 0 4px;font-size:12px;color:#777}
</style>
</head>
<body>
<h1 style="font-size:18px;margin:0 0 6px">html2gzh 探针：cqw / container-type / calc 在公众号里能不能活下来</h1>
<p style="margin:0 0 12px;color:#64748b">点按钮把探针写进剪贴板（直接写 HTML，不经浏览器选区序列化），到编辑器正文里 Ctrl+V。下面是本地在三个宽度下的效果，每一条红条都应停在标尺对应刻度上。</p>
<button type="button" id="copy">复制探针</button><span id="msg" role="status"></span>
<div class="widths" id="widths"></div>
<template id="probe">
<section data-t="R0" data-ignore-width="" style="container-type:inline-size;max-width:460px;margin:0 auto;padding:0;background:#eef2f7;color:#1f2937;font-size:15px;line-height:1.6;text-align:left">
<section data-t="H" style="padding:3cqw 4cqw;background:#1f2937;color:#eef2f7;font-weight:700">html2gzh 探针 · 可删除</section>
<section data-t="RULER" style="height:3cqw;margin:2cqw 0;background-image:linear-gradient(90deg,#1f2937 0 1px,transparent 1px 25%,#1f2937 25% calc(25% + 1px),transparent calc(25% + 1px) 50%,#1f2937 50% calc(50% + 1px),transparent calc(50% + 1px) 75%,#1f2937 75% calc(75% + 1px),transparent calc(75% + 1px));background-color:#e3dccd"></section>
<p data-t="L1" style="margin:2cqw 4cqw 0;font-size:13px">C1 宽 50cqw（应到 50% 刻度）</p>
<section data-t="C1" style="width:50cqw;height:3cqw;background:#2563eb"></section>
<p data-t="L2" style="margin:2cqw 4cqw 0;font-size:13px">C3 左外边距 25cqw + 宽 50cqw（25%→75%）</p>
<section data-t="C3" style="margin-left:25cqw;width:50cqw;height:3cqw;background:#2563eb"></section>
<p data-t="L3" style="margin:2cqw 4cqw 0;font-size:13px">C4 宽 50cqw + translate(25cqw,0)（25%→75%）</p>
<section data-t="C4" style="width:50cqw;height:3cqw;background:#2563eb;transform:translate(25cqw,0)"></section>
<p data-t="L4" style="margin:2cqw 4cqw 0;font-size:13px">C5 宽 calc(25cqw + 25cqw)（到 50%）</p>
<section data-t="C5" style="width:calc(25cqw + 25cqw);height:3cqw;background:#2563eb"></section>
<p data-t="L5" style="margin:2cqw 4cqw 0;font-size:13px">F2 浮动 + 负外边距 + translate（代替 absolute，方块在 50%~70%）</p>
<section data-t="F2W" style="height:8cqw">
<section data-t="F2" style="float:left;width:20cqw;height:8cqw;margin:0 -20cqw -8cqw 0;background:#2563eb;transform:translate(50cqw,0)"></section>
</section>
<p data-t="C2" style="margin:2cqw 4cqw 0;font-size:6cqw;font-weight:900;line-height:1.2">C2 字号 6cqw 随宽度缩放</p>
<p data-t="L6" style="margin:2cqw 4cqw 0;font-size:13px">V1 宽 calc(0.5 × min(460px, 100vw − 40px))（到 50%）</p>
<section data-t="V1" style="width:calc(0.5 * min(460px, 100vw - 40px));height:3cqw;background:#2f6db3"></section>
<p data-t="L7" style="margin:2cqw 4cqw 0;font-size:13px">V2 宽 50vw（对照，已知保留）</p>
<section data-t="V2" style="width:50vw;height:3cqw;background:#2f6db3"></section>
<p data-t="L8" style="margin:2cqw 4cqw 0;font-size:13px">P1 宽 50%（对照，已知会被定成 px）</p>
<section data-t="P1" style="width:50%;height:3cqw;background:#2f6db3"></section>
<p data-t="L9" style="margin:2cqw 4cqw 0;font-size:13px">D1 同一 style 里先 width:100px 再 width:50cqw（看回退写法会不会被合并）</p>
<section data-t="D1" style="width:100px;width:50cqw;height:3cqw;background:#7a5c00"></section>
<p data-t="L10" style="margin:2cqw 4cqw 0;font-size:13px">N1 内层容器：外层左右内边距 10cqw，内层 50cqw 相对内层</p>
<section data-t="N1O" style="padding:0 10cqw">
<section data-t="N1" style="container-type:inline-size;background:#e3dccd">
<section data-t="N1C" style="width:50cqw;height:3cqw;background:#2563eb"></section>
</section>
</section>
<p data-t="END" style="margin:3cqw 4cqw;font-size:13px">END</p>
</section>
</template>
<script>
const html = document.getElementById('probe').innerHTML.replace(/>\s+</g, '><').trim();
for (const w of [320, 375, 460]) {
  const box = document.createElement('div');
  box.innerHTML = `<p>${w}px</p>`;
  const frame = document.createElement('div');
  frame.style.width = w + 'px';
  frame.innerHTML = html;
  box.appendChild(frame);
  document.getElementById('widths').appendChild(box);
}
// 先走异步剪贴板 API；内嵌浏览器会按权限拒掉，再退回 copy 事件（只要真实点击带来的用户激活，不需要权限）
const legacyCopy = () => {
  const on = e => { e.clipboardData.setData('text/html', html); e.clipboardData.setData('text/plain', 'html2gzh 探针'); e.preventDefault(); };
  document.addEventListener('copy', on, { once: true });
  const ok = document.execCommand('copy');
  document.removeEventListener('copy', on);
  return ok;
};
document.getElementById('copy').onclick = async () => {
  const msg = document.getElementById('msg');
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob(['html2gzh 探针'], { type: 'text/plain' }),
    })]);
    msg.textContent = '已复制 ' + html.length + ' 字符（clipboard.write）';
  } catch (e) {
    msg.textContent = legacyCopy() ? '已复制 ' + html.length + ' 字符（copy 事件）' : '写剪贴板失败：' + e.message;
  }
};
</script>
</body>
</html>
